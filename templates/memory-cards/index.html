<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Match Challenge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/memory-cards/style.css">
</head>
<body>
   <header>
        <div class="header-inner">
            <span class="header-icon">🧠</span>
            <h1>Memory Card Match Challenge</h1>
        </div>
    </header>

    <!-- Start screen hidden - game auto-starts with AI difficulty -->
    <div id="startScreen" class="screen-container" style="display: none;"></div>

    <!-- Main Game Screen -->
    <div id="gameScreen" class="app-container">
        <div class="instruction-banner">
            Tap two cards to find matching pairs <span id="flip-count" class="flip-badge">| Moves: 0</span>
            <span id="ai-difficulty-banner" style="
                margin-left: 12px;
                background: linear-gradient(135deg, #7c3aed, #4c1d95);
                border-radius: 8px;
                padding: 2px 10px;
                font-size: 0.78em;
                color: #e0e7ff;
            "></span>
        </div>
        
        <main class="game-board" id="board"></main>

        <button type="button" class="restart-btn" onclick="restartWithAI()">🤖 New Game (AI Difficulty)</button>
    </div>

    <!-- Victory Modal -->
    <div id="successModal" class="modal-overlay">
        <div class="modal-card">
            <div class="star-badge">⭐ ⭐ ⭐</div>
            <h2>Wonderful Job!</h2>
            <p>You matched all the pairs perfectly! Your memory is shining bright today.</p>
            <button type="button" class="play-again-btn" onclick="restartWithAI()">Play Again (AI Difficulty)</button>
        </div>
    </div>

    <script src="/static/memory-cards/script.js"></script>
</body>
</html>
